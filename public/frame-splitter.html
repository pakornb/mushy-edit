        if (rowInkFraction(mask, yy, x, x+w) >= BORDER_LINE_THRESHOLD){
          if (yy > y){ h -= (yy - y); y = yy; }
          break;
        }
      }
    }
    // bottom: scan upward from the current bottom edge
    {
      const limit = (y+h) - h * BORDER_SEARCH_MARGIN;
      for (let yy = Math.round(y+h) - 1; yy >= Math.round(limit); yy--){
        if (rowInkFraction(mask, yy, x, x+w) >= BORDER_LINE_THRESHOLD){
          if (yy < y+h-1) h = yy - y + 1;
          break;
        }
      }
    }
    // left: scan rightward from the current left edge
    {
      const limit = x + w * BORDER_SEARCH_MARGIN;
      for (let xx = Math.round(x); xx <= Math.round(limit); xx++){
        if (colInkFraction(mask, xx, y, y+h) >= BORDER_LINE_THRESHOLD){
          if (xx > x){ w -= (xx - x); x = xx; }
          break;
        }
      }
    }
    // right: scan leftward from the current right edge
    {
      const limit = (x+w) - w * BORDER_SEARCH_MARGIN;
      for (let xx = Math.round(x+w) - 1; xx >= Math.round(limit); xx--){
        if (colInkFraction(mask, xx, y, y+h) >= BORDER_LINE_THRESHOLD){
          if (xx < x+w-1) w = xx - x + 1;
          break;
        }
      }
    }
    if (w < 10 || h < 10) return rect; // sanity guard, don't collapse the box
    return { x, y, w, h };
  }

  function fitAspect(rect, aspect){
    if (!aspect) return rect;
    const cx = rect.x + rect.w/2, cy = rect.y + rect.h/2;
    let w = rect.w, h = rect.h;
    if (w/h > aspect) h = w/aspect; else w = h*aspect;
    return { x: cx-w/2, y: cy-h/2, w, h };
  }

  // ---------- grid trim: refine each coarse cell to its actual content ----------
  function applyTrim(){
    if (!trimToggle.checked){
      trimRects = [];
      renderOverlay();
      return;
    }
    const cells = gridCropRects();
    const inset = parseFloat(insetInput.value) || 0;
    trimRects = cells.map(cell => {
      let rect = bestContentRect(cell);
      if (!rect) return null; // fall back to raw cell for this one
      if (borderSnapToggle.checked) rect = snapEdgesToBorder(rect);
      rect = { x: rect.x+inset, y: rect.y+inset, w: rect.w-2*inset, h: rect.h-2*inset };
      if (rect.w < 10 || rect.h < 10) return null;
      // clamp within cell
      rect.x = clamp(rect.x, cell.x, cell.x+cell.w-10);
      rect.y = clamp(rect.y, cell.y, cell.y+cell.h-10);
      rect.w = Math.min(rect.w, cell.x+cell.w-rect.x);
      rect.h = Math.min(rect.h, cell.y+cell.h-rect.y);
      return rect;
    });
    renderOverlay();
  }

  // ---------- manual mode ----------
  function renderManualOverlay(){
    canvasHolder.classList.toggle('tool-draw', manualTool === 'draw');
    manualBoxes.forEach((b, i) => {
      const el = document.createElement('div');
      const selected = selectedIds.has(b.id);
      el.className = 'manual-box' + (b.excluded ? ' excluded' : '') + (selected ? ' selected' : '');
      positionRect(el, b);
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = i + 1;
      el.appendChild(num);

      // Resize handles, delete (×) and the visibility toggle are only meaningful once
      // you can target a specific existing box — the Draw tool never modifies existing
      // boxes, so skip creating this chrome there to keep drawing over/near them clean.
      if (manualTool === 'select'){
        const rm = document.createElement('div');
        rm.className = 'rm';
        rm.textContent = '×';
        rm.title = 'Delete this box entirely';
        rm.addEventListener('pointerdown', e => { e.stopPropagation(); });
        rm.addEventListener('click', e => {
          e.stopPropagation();
          selectedIds.delete(b.id);
          manualBoxes.splice(i, 1);
          renderOverlay();
          pushHistory();
        });
        el.appendChild(rm);

        const toggle = document.createElement('div');
        toggle.className = 'box-toggle' + (b.excluded ? ' excluded' : '');
        toggle.innerHTML = eyeIconSVG(b.excluded);
        toggle.title = b.excluded ? 'Hidden — click to show this frame again' : 'Click to hide this frame from output';
        toggle.addEventListener('pointerdown', e => { e.stopPropagation(); });
        toggle.addEventListener('click', e => {
          e.stopPropagation();
          b.excluded = !b.excluded;
          syncActionButtons();
          renderOverlay();
          pushHistory();
        });
        el.appendChild(toggle);

        const resizeSE = document.createElement('div');
        resizeSE.className = 'handle se';
        resizeSE.style.position = 'absolute';
        resizeSE.style.right = '-7px';
        resizeSE.style.bottom = '-7px';
        resizeSE.style.left = 'auto';
        resizeSE.style.top = 'auto';
        resizeSE.style.transform = 'none';
        el.appendChild(resizeSE);

        const resizeNW = document.createElement('div');
        resizeNW.className = 'handle nw';
        resizeNW.style.position = 'absolute';
        resizeNW.style.left = '-7px';
        resizeNW.style.top = '-7px';
        resizeNW.style.right = 'auto';
        resizeNW.style.bottom = 'auto';
        resizeNW.style.transform = 'none';
        el.appendChild(resizeNW);

        makeManualBoxSelectable(el, i);
        makeManualResizeDraggable(resizeSE, i, 'se');
        makeManualResizeDraggable(resizeNW, i, 'nw');
      }

      canvasHolder.appendChild(el);
    });
    syncActionButtons();
  }

  // Clones the boxes matching the given ids (fresh ids assigned), appends them to
  // manualBoxes, and returns the set of new ids. Used by shift-drag-to-clone.
  function cloneBoxesByIds(ids){
    const clones = [];
    manualBoxes.forEach(b => { if (ids.has(b.id)) clones.push({ ...b, id: nextBoxId++ }); });
    manualBoxes.push(...clones);
    return new Set(clones.map(c => c.id));
  }

  // Select tool, box body:
  //  - click (no shift): select only this box
  //  - click a box already selected within a multi-selection, no drag: collapses to just this one
  //  - drag (no shift): moves the current selection (the whole group if this box was already
  //    part of one, otherwise just this box)
  //  - shift+click, released without moving: toggles this box's membership in the selection
  //  - shift+drag: clones what's being dragged (the whole selection if this box was already
  //    selected, otherwise just this one box) and moves the clone(s); the clone(s) become the
  //    new selection
  function makeManualBoxSelectable(el, index){
    el.addEventListener('pointerdown', e => {
      if (e.target !== el) return; // let handles/rm/toggle handle themselves
      e.preventDefault();
      el.setPointerCapture(e.pointerId);

      const id = manualBoxes[index].id;
      const shift = e.shiftKey;
      const wasSelected = selectedIds.has(id);
      const priorSelection = new Set(selectedIds);

      // The only case with one unambiguous meaning regardless of what happens next.
      if (!shift && !wasSelected){
        selectedIds = new Set([id]);
        renderOverlay();
      }

      const startX = e.clientX, startY = e.clientY;
      let moved = false;
      let dragIds = null;
      let dragStart = null;

      function beginDrag(){
        if (dragIds) return;
        if (shift){
          dragIds = cloneBoxesByIds(wasSelected ? priorSelection : new Set([id]));
          selectedIds = new Set(dragIds);
        } else {
          dragIds = (wasSelected && priorSelection.size > 1) ? new Set(priorSelection) : new Set([id]);
        }
        dragStart = {};
        manualBoxes.forEach(b => { if (dragIds.has(b.id)) dragStart[b.id] = { x: b.x, y: b.y }; });
        renderOverlay();
      }

      function move(ev){
        const dx = toNat(ev.clientX - startX), dy = toNat(ev.clientY - startY);
        if (!moved && Math.max(Math.abs(toDisp(dx)), Math.abs(toDisp(dy))) > SMART_ADD_DRAG_THRESHOLD){
          moved = true;
          beginDrag();
        }
        if (!moved) return;
        manualBoxes.forEach(b => {
          if (!dragIds.has(b.id)) return;
          const s = dragStart[b.id];
          b.x = clamp(s.x + dx, 0, natW - b.w);
          b.y = clamp(s.y + dy, 0, natH - b.h);
        });
        renderOverlay();
      }
      function up(){
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        if (!moved){
          if (shift){
            if (wasSelected) selectedIds.delete(id);
            else selectedIds.add(id);
          } else if (wasSelected){
            selectedIds = new Set([id]);
          }
          renderOverlay();
        } else {
          pushHistory();
        }
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  }

  function makeManualResizeDraggable(handle, index, corner){
    corner = corner || 'se';
    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      const startX = e.clientX, startY = e.clientY;
      const start = { ...manualBoxes[index] };
      function move(ev){
        const dx = toNat(ev.clientX - startX);
        const dy = toNat(ev.clientY - startY);
        let x = start.x, y = start.y, w = start.w, h = start.h;
        if (corner === 'se'){
          w = clamp(start.w + dx, 20, natW - start.x);
          h = manualAspect ? w / manualAspect : clamp(start.h + dy, 20, natH - start.y);
          if (manualAspect && start.y + h > natH) { h = natH - start.y; w = h * manualAspect; }
        } else { // nw: opposite corner (start.x+start.w, start.y+start.h) stays fixed
          const fixedRight = start.x + start.w, fixedBottom = start.y + start.h;
          w = clamp(start.w - dx, 20, fixedRight);
          h = manualAspect ? w / manualAspect : clamp(start.h - dy, 20, fixedBottom);
          if (manualAspect && h > fixedBottom) { h = fixedBottom; w = h * manualAspect; }
          x = fixedRight - w;
          y = fixedBottom - h;
          x = clamp(x, 0, fixedRight - 20);
          y = clamp(y, 0, fixedBottom - 20);
        }
        manualBoxes[index] = { ...manualBoxes[index], x, y, w, h };
        renderOverlay();
      }
      function up(){
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        pushHistory();
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  }

  // ---------- manual tool switch: Draw (default) vs Select / Move ----------
  function setManualTool(tool){
    manualTool = tool;
    drawToolBtn.classList.toggle('active', tool === 'draw');
    selectToolBtn.classList.toggle('active', tool === 'select');
    if (displayCanvas) displayCanvas.style.cursor = tool === 'draw' ? 'crosshair' : 'default';
    renderOverlay();
  }
  drawToolBtn.addEventListener('click', () => setManualTool('draw'));
  selectToolBtn.addEventListener('click', () => setManualTool('select'));

  // Delete/Backspace removes every selected box while the Select/Move tool is active.
  // Bails when focus is in a text field so typing in e.g. the filename prefix or a
  // rows/cols input isn't hijacked.
  window.addEventListener('keydown', e => {
    if (e.key !== 'Delete' && e.key !== 'Backspace') return;
    if (mode !== 'manual' || manualTool !== 'select' || !selectedIds.size) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (document.activeElement && document.activeElement.isContentEditable)) return;
    e.preventDefault();
    manualBoxes = manualBoxes.filter(b => !selectedIds.has(b.id));
    selectedIds.clear();
    renderOverlay();
    pushHistory();
  });

  // ---------- draw tool: click a frame to auto-detect its bounds, or drag to draw one exactly ----------

  function searchWindowAround(cx, cy){
    const w = Math.min(natW, natW*0.6), h = Math.min(natH, natH*0.6);
    let x = clamp(cx - w/2, 0, Math.max(0, natW-w));
    let y = clamp(cy - h/2, 0, Math.max(0, natH-h));
    return { x, y, w, h };
  }

  // Drag distance (in DISPLAYED px) below which a smart-add gesture counts as a plain
  // click rather than a drawn box — small enough that an intentional drag never gets
  // mistaken for a click, generous enough that a slightly-shaky click doesn't trigger
  // the "use exactly what I drew" path by accident.
  const SMART_ADD_DRAG_THRESHOLD = 4;

  // click a point: auto-detect the frame under it (old "smart add" behavior)
  function smartAddDetectAt(natX, natY){
    let box = bestContentRectNear(natX, natY, searchWindowAround(natX, natY));
    if (box && borderSnapToggle.checked) box = snapEdgesToBorder(box);
    if (!box){
      const w = natW*0.25, h = manualAspect ? w/manualAspect : natH*0.2;
      box = { x: clamp(natX-w/2,0,natW-w), y: clamp(natY-h/2,0,natH-h), w, h };
    } else {
      box = fitAspect(box, manualAspect);
      box.x = clamp(box.x, 0, natW-box.w);
      box.y = clamp(box.y, 0, natH-box.h);
    }
    return box;
  }

  // drag a rectangle: use exactly what was drawn (only refined inward to a real border,
  // never re-detected/grown from a single point) so the box always matches the drag
  function smartAddRectFromDrag(x0, y0, x1, y1){
    let box = {
      x: clamp(Math.min(x0, x1), 0, natW),
      y: clamp(Math.min(y0, y1), 0, natH),
      w: Math.abs(x1 - x0),
      h: Math.abs(y1 - y0)
    };
    if (borderSnapToggle.checked) box = snapEdgesToBorder(box);
    box = fitAspect(box, manualAspect);
    box.w = clamp(box.w, 20, natW);
    box.h = clamp(box.h, 20, natH);
    box.x = clamp(box.x, 0, natW - box.w);
    box.y = clamp(box.y, 0, natH - box.h);
    return box;
  }

  function canvasPointFromEvent(e){
    const rect = displayCanvas.getBoundingClientRect();
    const dispX = clamp(e.clientX - rect.left, 0, rect.width);
    const dispY = clamp(e.clientY - rect.top, 0, rect.height);
    return { natX: toNat(dispX), natY: toNat(dispY) };
  }

  function stagePointerDownHandler(e){
    if (mode !== 'manual') return;
    if (e.target !== displayCanvas) return;
    if (manualTool === 'select'){
      // clicked empty canvas (not any box, since boxes sit above the canvas and catch
      // their own pointerdown in select mode) — clear the current selection
      if (selectedIds.size){ selectedIds.clear(); renderOverlay(); }
      return;
    }
    if (manualTool !== 'draw') return;
    e.preventDefault();
    displayCanvas.setPointerCapture(e.pointerId);

    const start = canvasPointFromEvent(e);
    let moved = false;
    const previewEl = document.createElement('div');
    previewEl.className = 'smart-add-drag';
    canvasHolder.appendChild(previewEl);
    positionRect(previewEl, { x: start.natX, y: start.natY, w: 0, h: 0 });

    function move(ev){
      const cur = canvasPointFromEvent(ev);
      const x = Math.min(start.natX, cur.natX), y = Math.min(start.natY, cur.natY);
      const w = Math.abs(cur.natX - start.natX), h = Math.abs(cur.natY - start.natY);
      if (toDisp(Math.max(w, h)) > SMART_ADD_DRAG_THRESHOLD) moved = true;
      positionRect(previewEl, { x, y, w, h });
    }
    function up(ev){
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      previewEl.remove();
      const end = canvasPointFromEvent(ev);
      const box = moved
        ? smartAddRectFromDrag(start.natX, start.natY, end.natX, end.natY)
        : smartAddDetectAt(end.natX, end.natY);
      box.id = nextBoxId++;
      manualBoxes.push(box);
      renderOverlay();
      pushHistory();
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  aspectPresets.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      aspectPresets.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      manualAspect = btn.dataset.r === 'free' ? null : parseFloat(btn.dataset.r);
    });
  });

  // ---------- mode switching ----------
  modeGridBtn.addEventListener('click', () => setMode('grid'));
  modeManualBtn.addEventListener('click', () => setMode('manual'));
  function setMode(m){
    mode = m;
    modeGridBtn.classList.toggle('active', m === 'grid');
    modeManualBtn.classList.toggle('active', m === 'manual');
    gridControls.style.display = m === 'grid' ? 'block' : 'none';
    manualControls.style.display = m === 'manual' ? 'block' : 'none';
    exportBtn.disabled = m === 'grid' ? (vLines.length === 0 && hLines.length === 0 && !(rowsInput.value==1 && colsInput.value==1)) : manualBoxes.length === 0;
    processBtn.disabled = exportBtn.disabled;
    sendMushyBtn.disabled = exportBtn.disabled;
    if (m !== 'manual'){
      manualTool = 'draw';
      drawToolBtn.classList.add('active');
      selectToolBtn.classList.remove('active');
      if (displayCanvas) displayCanvas.style.cursor = 'default';
    }
    renderOverlay();
  }

  // ---------- export ----------
  function computeHasCrops(){
    if (mode === 'grid'){
      const rows = parseInt(rowsInput.value) || 0, cols = parseInt(colsInput.value) || 0;
      const hasGrid = !(vLines.length === 0 && hLines.length === 0 && !(rows === 1 && cols === 1));
      if (!hasGrid) return false;
      return computeCurrentCrops().length > 0;
    }
    return manualBoxes.length > 0;
  }

  function syncActionButtons(){
    const has = computeHasCrops();
    exportBtn.disabled = !has;
    processBtn.disabled = !has;
    sendMushyBtn.disabled = !has;
    updateNamePreview();
  }

  function computeCurrentCrops(){
    return computeCurrentCropsIndexed().map(o => o.rect);
  }

  // like computeCurrentCrops, but keeps each rect's source index/mode so a frame can be
  // traced back to (and excluded/removed from) the cell or box it came from
  function computeCurrentCropsIndexed(){
    if (mode === 'grid'){
      return finalGridRects()
        .map((r, i) => ({ rect: r, sourceIndex: i, sourceMode: 'grid' }))
        .filter(o => !excludedCells[o.sourceIndex]);
    }
    return manualBoxes
      .map((b, i) => ({ rect: b, sourceIndex: i, sourceMode: 'manual' }))
      .filter(o => !o.rect.excluded);
  }

  function cropToCanvas(r, targetH){
    const c = document.createElement('canvas');
    let outW = Math.round(r.w), outH = Math.round(r.h);
    if (targetH){
      outH = Math.round(targetH);
      outW = Math.round(r.w * (outH / r.h));
    }
    c.width = outW;
    c.height = outH;
    const cctx = c.getContext('2d');
    cctx.imageSmoothingEnabled = true;
    cctx.imageSmoothingQuality = 'high';
    cctx.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, outW, outH);
    return c;
  }

  processBtn.addEventListener('click', async () => {
    processBtn.disabled = true;
    processBtn.textContent = 'Processing…';
    try {
      const crops = computeCurrentCropsIndexed();
      if (!crops.length){
        alert('Nothing to process yet — detect a grid or add crop boxes first.');
        return;
      }
      const targetH = targetHeightForExport();
      const frames = [];
      for (let i = 0; i < crops.length; i++){
        const c = cropToCanvas(crops[i].rect, targetH);
        const blob = await new Promise(res => c.toBlob(res, currentMime(), currentQuality()));
        frames.push({ url: URL.createObjectURL(blob), blob, w: c.width, h: c.height, sourceIndex: crops[i].sourceIndex, sourceMode: crops[i].sourceMode });
      }
      processedFrames.forEach(f => { if (f.url) URL.revokeObjectURL(f.url); });
      processedFrames = frames;
      processedIndex = 0;
      if (currentPageIndex >= 0) pages[currentPageIndex].processed = processedFrames;
      viewerMode = 'processed';
      updateViewerUI();
      sendMushyBtn.disabled = false;
    } finally {
      processBtn.disabled = false;
      processBtn.textContent = 'Process sheet → preview';
    }
  });

  // Snapshots every page's already-processed frames (built by the loop just above) into
  // the shape the export would actually produce: one flat sequence if continuous numbering
  // is on, or page-by-page groups if each page numbers its own frames from 1.
  function buildCombinedPreview(){
    const counts = pages.map(p => (p.processed || []).length);
    const groups = pages.map((p, pi) => ({
      pageName: p.name || ('Page ' + (pi+1)),
      frames: (p.processed || []).map((f, i) => ({
        url: f.url, w: f.w, h: f.h,
        fname: exportFileName(pi, i+1, counts)
      }))
    }));
    return {
      continuous: continuousNumberToggle.checked,
      groups,
      totalCount: counts.reduce((a,b) => a+b, 0)
    };
  }

  async function processAllPages(triggerBtn){
    if (pages.length < 2){
      alert('Add more than one page first — this processes every loaded page at once.');
      return;
    }
    const originalLabel = triggerBtn.textContent;
    processAllBtn.disabled = true;
    previewExportBtn.disabled = true;
    triggerBtn.textContent = 'Processing all…';
    try {
      const targetH = targetHeightForExport();
      const startIndex = currentPageIndex;
      saveCurrentPageState();
      for (let i = 0; i < pages.length; i++){
        const p = pages[i];
        img = p.img; natW = p.natW; natH = p.natH;
        content = { ...p.content };
        vLines = p.vLines.slice();
        hLines = p.hLines.slice();
        trimRects = p.trimRects.slice();
        excludedCells = p.excludedCells ? p.excludedCells.slice() : [];
        manualBoxes = p.manualBoxes.map(b => ({ ...b }));

        const crops = computeCurrentCropsIndexed();
        const frames = [];
        for (let f = 0; f < crops.length; f++){
          const c = cropToCanvas(crops[f].rect, targetH);
          const blob = await new Promise(res => c.toBlob(res, currentMime(), currentQuality()));
          frames.push({ url: URL.createObjectURL(blob), blob, w: c.width, h: c.height, sourceIndex: crops[f].sourceIndex, sourceMode: crops[f].sourceMode });
        }
        (p.processed || []).forEach(f => { if (f.url) URL.revokeObjectURL(f.url); });
        p.processed = frames;
      }
      currentPageIndex = -1; // same reasoning as detectAllBtn — skip switchToPage's auto-save
      switchToPage(startIndex);
      processedFrames = pages[startIndex].processed;
      processedIndex = 0;
      combinedPreview = buildCombinedPreview();
      viewerMode = 'export';
      updateViewerUI();
      syncActionButtons();
      sendMushyBtn.disabled = false;
    } finally {
      processAllBtn.disabled = false;
      previewExportBtn.disabled = false;
      triggerBtn.textContent = originalLabel;
    }
  }

  processAllBtn.addEventListener('click', () => processAllPages(processAllBtn));
  previewExportBtn.addEventListener('click', () => processAllPages(previewExportBtn));

  // Builds the export output according to the chosen zip layout:
  //  - "folders": one zip, each page in its own subfolder (today's original behavior)
  //  - "flat":    one zip, every frame at the root (collisions disambiguated by page name)
  //  - "perpage": one separate zip file per page
  // Returns { zips: [{zipName, blob}], thumbData } — always at least one zip.
  async function buildFramesOutput(){
    const targetH = targetHeightForExport();
    const thumbData = [];
    const startIndex = currentPageIndex;
    saveCurrentPageState();
    const pageCounts = getPageFrameCounts();

    const multi = pages.length > 1;
    const zipMode = multi ? zipModeSelect.value : 'folders';
    const pageList = pages.length ? pages : [{ name: 'frame', img, natW, natH, content, vLines, hLines, trimRects, manualBoxes, excludedCells }];

    async function renderPageFrames(p, pi){
      img = p.img; natW = p.natW; natH = p.natH;
      content = { ...p.content };
      vLines = p.vLines.slice();
      hLines = p.hLines.slice();
      trimRects = p.trimRects.slice();
      excludedCells = p.excludedCells ? p.excludedCells.slice() : [];
      manualBoxes = p.manualBoxes.map(b => ({ ...b }));
      const crops = computeCurrentCrops();
      const out = [];
      for (let i = 0; i < crops.length; i++){
        const c = cropToCanvas(crops[i], targetH);
        const blob = await new Promise(res => c.toBlob(res, currentMime(), currentQuality()));
        out.push({ fname: exportFileName(pi, i+1, pageCounts), blob });
      }
      return out;
    }

    const zips = [];

    if (zipMode === 'perpage'){
      const usedZipNames = new Set();
      for (let pi = 0; pi < pageList.length; pi++){
        const p = pageList[pi];
        const frames = await renderPageFrames(p, pi);
        const zip = new JSZip();
        let base = (p.name || 'page' + String(pi+1).padStart(2,'0')).replace(/[\\/:*?"<>|]/g, '_');
        let candidate = base, n = 2;
        while (usedZipNames.has(candidate)) candidate = base + '_' + (n++);
        usedZipNames.add(candidate);
        frames.forEach(f => {
          zip.file(f.fname, f.blob);
          thumbData.push({ url: URL.createObjectURL(f.blob), name: candidate + '.zip/' + f.fname });
        });
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        zips.push({ zipName: candidate + '.zip', blob: zipBlob });
      }
    } else {
      const zip = new JSZip();
      const usedEntryNames = new Set();
      for (let pi = 0; pi < pageList.length; pi++){
        const p = pageList[pi];
        const frames = await renderPageFrames(p, pi);
        let folder = '';
        if (zipMode === 'folders' && multi){
          let base = (p.name || 'page' + String(pi+1).padStart(2,'0')).replace(/[\\/:*?"<>|]/g, '_');
          let candidate = base, n = 2;
          while (usedEntryNames.has(candidate)) candidate = base + '_' + (n++);
          usedEntryNames.add(candidate);
          folder = candidate + '/';
        }
        frames.forEach(f => {
          let entryName = folder + f.fname;
          if (zipMode === 'flat' && multi){
            // per-page numbering can collide once folders are removed — disambiguate, don't overwrite
            let candidate = entryName, n2 = 2;
            while (usedEntryNames.has(candidate)){
              const dot = entryName.lastIndexOf('.');
              candidate = entryName.slice(0, dot) + '_' + (n2++) + entryName.slice(dot);
            }
            usedEntryNames.add(candidate);
            entryName = candidate;
          }
          zip.file(entryName, f.blob);
          thumbData.push({ url: URL.createObjectURL(f.blob), name: entryName });
        });
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      zips.push({ zipName: 'frames.zip', blob: zipBlob });
    }

    if (pages.length && startIndex >= 0){
      const cur = pages[startIndex];
      img = cur.img; natW = cur.natW; natH = cur.natH;
      content = { ...cur.content };
      vLines = cur.vLines.slice();
      hLines = cur.hLines.slice();
      trimRects = cur.trimRects.slice();
      excludedCells = cur.excludedCells ? cur.excludedCells.slice() : [];
      manualBoxes = cur.manualBoxes.map(b => ({ ...b }));
    }

    return { zips, thumbData };
  }

  async function downloadZips(zips){
    for (let i = 0; i < zips.length; i++){
      const { zipName, blob } = zips[i];
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = zipName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if (i < zips.length - 1) await new Promise(r => setTimeout(r, 350)); // avoid browser popup-blocking rapid downloads
    }
  }

  exportBtn.addEventListener('click', async () => {
    exportBtn.disabled = true;
    exportBtn.textContent = 'Exporting…';
    try {
      const { zips, thumbData } = await buildFramesOutput();
      await downloadZips(zips);

      thumbGrid.innerHTML = '';
      thumbsTitle.textContent = '// ' + thumbData.length + ' frames exported'
        + (zips.length > 1 ? ' across ' + zips.length + ' zip files' : '');
      thumbData.forEach(t => {
        const div = document.createElement('div');
        div.className = 'thumb';
        div.innerHTML = '<img src="' + t.url + '"><div class="cap">' + t.name + '</div>';
        thumbGrid.appendChild(div);
      });
      thumbs.style.display = 'block';
    } finally {
      exportBtn.disabled = false;
      exportBtn.textContent = pages.length > 1 ? 'Export all frames (.zip)' : 'Export frames (.zip)';
    }
  });

  // Same per-page rendering as buildFramesOutput, but returns a flat, unzipped list —
  // used when embedded in Mushy Edit, which can take real File/Blob objects directly
  // and skip the zip round-trip entirely.
  async function buildFlatFileList(){
    const targetH = targetHeightForExport();
    const startIndex = currentPageIndex;
    saveCurrentPageState();
    const pageCounts = getPageFrameCounts();
    const pageList = pages.length ? pages : [{ name: 'frame', img, natW, natH, content, vLines, hLines, trimRects, manualBoxes, excludedCells }];
    const usedNames = new Set();
    const out = [];

    for (let pi = 0; pi < pageList.length; pi++){
      const p = pageList[pi];
      img = p.img; natW = p.natW; natH = p.natH;
      content = { ...p.content };
      vLines = p.vLines.slice();
      hLines = p.hLines.slice();
      trimRects = p.trimRects.slice();
      excludedCells = p.excludedCells ? p.excludedCells.slice() : [];
      manualBoxes = p.manualBoxes.map(b => ({ ...b }));

      const crops = computeCurrentCrops();
      for (let i = 0; i < crops.length; i++){
        const c = cropToCanvas(crops[i], targetH);
        const blob = await new Promise(res => c.toBlob(res, currentMime(), currentQuality()));
        let name = exportFileName(pi, i+1, pageCounts);
        if (usedNames.has(name)){
          const dot = name.lastIndexOf('.');
          let n2 = 2, candidate;
          do { candidate = name.slice(0,dot) + '_' + (n2++) + name.slice(dot); } while (usedNames.has(candidate));
          name = candidate;
        }
        usedNames.add(name);
        out.push({ name, blob });
      }
    }

    if (pages.length && startIndex >= 0){
      const cur = pages[startIndex];
      img = cur.img; natW = cur.natW; natH = cur.natH;
      content = { ...cur.content };
      vLines = cur.vLines.slice();
      hLines = cur.hLines.slice();
      trimRects = cur.trimRects.slice();
      excludedCells = cur.excludedCells ? cur.excludedCells.slice() : [];
      manualBoxes = cur.manualBoxes.map(b => ({ ...b }));
    }
    return out;
  }

  // ---------- send to Mushy Edit ----------
  if (embedded){
    sendMushyBtn.textContent = 'Insert into Mushy Edit';
    previewMushyBtn.style.display = 'none'; // the mockup preview is moot once actually embedded
  }

  sendMushyBtn.addEventListener('click', async () => {
    sendMushyBtn.disabled = true;
    sendMushyBtn.textContent = embedded ? 'Inserting…' : 'Preparing…';
    try {
      if (embedded){
        const files = await buildFlatFileList();
        window.parent.postMessage({ type: 'frameSplitterExport', files }, location.origin);
        return;
      }
      const { zips } = await buildFramesOutput();
      await downloadZips(zips);

      let mushyUrl = '';
      try { mushyUrl = localStorage.getItem('mushyEditUrl') || ''; } catch (e) {}
      const zipWord = zips.length > 1 ? zips.length + ' zip files are' : 'frames.zip is';
      const input = prompt(
        zipWord + ' downloading. Drop ' + (zips.length > 1 ? 'them' : 'it') + ' onto the Mushy Edit import screen to bring these in as boards.\n\nWant this button to also open Mushy Edit in a new tab next time? Enter its URL (leave blank to skip):',
        mushyUrl
      );
      if (input !== null){
        mushyUrl = input.trim();
        try { localStorage.setItem('mushyEditUrl', mushyUrl); } catch (e) {}
      }
      if (mushyUrl) window.open(mushyUrl, '_blank');
    } finally {
      sendMushyBtn.disabled = false;
      sendMushyBtn.textContent = embedded ? 'Insert into Mushy Edit' : 'Send to Mushy Edit';
    }
  });

  // ---------- preview: what this looks like integrated into Mushy Edit ----------
  previewMushyBtn.addEventListener('click', () => {
    const overlay = document.createElement('div');
    overlay.className = 'mushy-modal-overlay';
    const framesForPreview = processedFrames.length ? processedFrames : null;

    const slotRow = framesForPreview
      ? framesForPreview.map((f, i) =>
          '<div class="mm-slot"><img src="' + f.url + '"><div class="mm-num">board ' + (i+1) + '</div></div>'
        ).join('')
      : '<div style="font-family:ui-monospace,monospace; font-size:11px; color:#5b6472; padding:6px;">Click "Process sheet → preview" first to see your actual frames staged here.</div>';

    overlay.innerHTML =
      '<div class="mushy-mock">' +
        '<div class="mm-header">' +
          '<h1><span class="dot">▍</span> Mushy Edit</h1>' +
          '<button class="mm-close" id="mmClose">Close preview ×</button>' +
        '</div>' +
        '<div class="mm-body">' +
          '<div class="mm-note">This is a mockup of the intended flow, styled after Mushy Edit\'s real header/import screen — nothing is actually sent to Mushy Edit from here yet. It shows what dropping a split sheet into its import step could look like.</div>' +
          '<div class="mm-label">Incoming — split from your storyboard sheet</div>' +
          '<div class="mm-slot-row">' + slotRow + '</div>' +
          '<button class="mm-cta" id="mmInsert">Insert ' + (framesForPreview ? framesForPreview.length : 'N') + ' boards →</button>' +
          '<button class="mm-ghost" id="mmCancel">Cancel</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(overlay);
    overlay.querySelector('#mmClose').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#mmCancel').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#mmInsert').addEventListener('click', () => {
      alert('In the real integration, this is where these boards would land directly in your Mushy Edit timeline — no zip, no drag-and-drop. That part isn\'t wired up yet; today\'s working bridge is "Send to Mushy Edit" (downloads frames.zip to drop into the existing import screen).');
    });
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  });

  function finalGridRects(){
    const cells = gridCropRects();
    if (!trimToggle.checked || trimRects.length !== cells.length) return cells;
    return cells.map((cell, i) => trimRects[i] || cell);
  }

  function gridCropRects(){
    const rowBounds = [content.y, ...hLines, content.y + content.h];
    const colBounds = [content.x, ...vLines, content.x + content.w];
    const rects = [];
    for (let r = 0; r < rowBounds.length - 1; r++){
      for (let c = 0; c < colBounds.length - 1; c++){
        rects.push({
          x: colBounds[c], y: rowBounds[r],
          w: colBounds[c+1] - colBounds[c], h: rowBounds[r+1] - rowBounds[r]
        });
      }
    }
    return rects;
  }

  // ---------- reset ----------
  resetBtn.addEventListener('click', () => {
    pages = [];
    currentPageIndex = -1;
    img = null;
    manualBoxes = [];
    selectedIds.clear();
    vLines = []; hLines = []; trimRects = []; excludedCells = [];
    fullMask = null;
    processedFrames.forEach(f => { if (f.url) URL.revokeObjectURL(f.url); });
    processedFrames = [];
    processedIndex = 0;
    viewerMode = 'original';
    combinedPreview = null;
    history = []; historyIndex = -1;
    manualTool = 'draw';
    drawToolBtn.classList.add('active');
    selectToolBtn.classList.remove('active');
    controls.classList.add('disabled');
    stageContent.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-stage';
    empty.textContent = 'Add a storyboard image above to get started.';
    stageContent.appendChild(empty);
    renderPageStrip();
    thumbs.style.display = 'none';
    thumbGrid.innerHTML = '';
    fileInput.value = '';
  });

  window.addEventListener('resize', () => { if (img) buildStage(); });
  renderPageStrip();
  updateNamePreview();

  // ---------- embedded mode: receive files from the parent (Mushy Edit) ----------
  if (embedded){
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'frameSplitterInit' && Array.isArray(e.data.files) && e.data.files.length){
        addFiles(e.data.files);
      }
    });
    window.parent.postMessage({ type: 'frameSplitterReady' }, location.origin);
  }
})();
</script>
</body>
